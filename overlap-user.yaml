apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  namespace: default
  name: admins
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  namespace: default
  name: developers
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  namespace: default
  name: overlap-user
spec:
  # In BOTH groups — this is what makes "overlap"
  memberOf: [admins, developers]
